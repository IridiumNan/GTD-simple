name: Deploy GTD-simple APP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: fedora-host
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"


      - name: Build then Deploy
        run: |
          go build -o gtd-cli .
          systemctl stop gtd-simple
          cp gtd-cli /opt/gtd-simple/
          cd /opt/gtd-simple
          systemctl start gtd-simple
