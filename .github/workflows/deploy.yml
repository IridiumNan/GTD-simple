name: Deploy GTD-simple APP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: fedora-host
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: prepare
        run: |
          sed -i 's/dev/dep/g' ./front/js/capture/config/config.js
          cat ./front/js/capture/config/config.js
          tar -cJf ./internal/utils/front.tar.xz ./front

      - name: Build then Deploy
        run: |
          go build -o gtd-cli .
          systemctl stop gtd-simple
          mv gtd-cli /opt/gtd-simple/
          cd /opt/gtd-simple
          ./gtd-cli init
          systemctl start gtd-simple
