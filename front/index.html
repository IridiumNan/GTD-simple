<!DOCTYPE html>
<html lang="zh-CN">

	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>GTD Simple</title>
		<link rel="stylesheet" type="text/css" href="capture.css">
	</head>

	<body>

		<main>
			<h1>Capture Box</h1>

			<form id="form">
				<input id="input" type="text" name="stuff" placeholder="Just write down" autocomplete="off" autofocus>
			</form>

			<ul id="list"></ul>
			<!-- <p id="empty">there is no any stuff</p> -->
			<button type="button" id="commit">commit delete</button>
			<br>
			<button type="button" id="clear">clear deleted stuffs</button>
			<br>
			<p id="stat"></p>
			<script src="./js/capture/main.js" type="module">
			</script>
		</main>
	</body>
</html>
